[project]
name = "bookkit"
version = "0.1.0"
description = "Layout measurement, pagination, and production for the book-writing skill"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49",
    "pypdf>=5.1",
    # Rasterising a diagram is the only way to confirm ink actually reaches
    # the page; computed styles describe intent, not output.
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bookkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
